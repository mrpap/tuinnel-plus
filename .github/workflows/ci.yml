name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Smoke-test the built CLI
        run: |
          version=$(node -p "require('./package.json').version")
          out=$(node dist/index.js --version)
          echo "$out"
          case "$out" in "$version"|"$version ("*")") ;; *) echo "Built CLI reports '$out', expected $version"; exit 1 ;; esac
