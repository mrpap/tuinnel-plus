name: Release

# Push a tag like v0.1.1 on main to stage that version on npm and create a GitHub release.
# npm trusted publishing (OIDC) is used, so no npm token is stored in this repository.
# Staged versions go live once a maintainer approves them on npmjs.com (2FA).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must point at main and match package.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag $GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      - name: Stage on npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "tuinnel-plus@$version" version >/dev/null 2>&1; then
            echo "tuinnel-plus@$version is already on npm, skipping publish"
          else
            npm stage publish . --access public --provenance
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
